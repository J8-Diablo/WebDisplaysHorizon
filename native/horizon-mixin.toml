# WebDisplays: a native trait mod (docs/native-mods.md, "Trait mods"), and the whole mod in
# one file. The blocks, items and assets are a content mod (../content) that rides inside this
# bundle, in data/ (see the injection below).
# Build it with
# `horizon-launcher native-build <this folder> --instance <instance> --trust-native-code`.
[mod]
id = "webdisplays_native"
version = "0.1.0"

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[api]
path = "api"

# The browser: HCEF starts it, keeps the link to it and downloads it (its own mod, as MCEF
# is for the Java version). The launcher makes it the crate `hcef` of this mod's package.
[dependencies]
hcef = "^0.1"

# The content mod (blocks, items, recipes, textures, sounds, text) rides inside this bundle,
# data/webdisplays-content.hmod, so that the mod is one file to install: the game's list of
# content mods gets it as a development mod (written once to .horizon-cache).
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]
